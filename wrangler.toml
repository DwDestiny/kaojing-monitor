name = "kaojing-monitor"
pages_build_output_dir = "frontend/out"
compatibility_date = "2026-08-17"

# 注意：[vars] 里的环境变量只在运行时（Pages Functions）可用，
# 不会注入到构建阶段（npm run build）。
# Next.js 的 NEXT_PUBLIC_* 变量需要在构建时被打包进静态 JS，
# 所以必须在 Cloudflare Pages Dashboard 的 Environment variables 里设置，
# 不能只放在这个文件里。
[vars]
ENVIRONMENT = "production"
