# Cloudflare Pages 部署配置
# 文档: https://developers.cloudflare.com/pages/framework-guides/nextjs/
#
# 方式一：使用 @cloudflare/next-on-pages
#   npm install -D @cloudflare/next-on-pages
#   npx @cloudflare/next-on-pages
#   npx wrangler pages deploy .vercel/output/static
#
# 方式二：Cloudflare Pages 控制台连接 Git，构建命令见 README

name = "kaoqing-frontend"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# 生产环境 API 代理需在 Pages Functions 或前端环境变量中配置
# 推荐：NEXT_PUBLIC_API_BASE_URL=https://api.example.com
