name = "kaojing-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "kaojing-db"
database_id = "6ddc90cf-ea1b-4b67-b095-7d545b8fb851"

# Cron 定时任务
[triggers]
crons = ["7 2 * * *", "23 14 * * *"]

# 环境变量
[vars]
ENVIRONMENT = "production"
