# 定时爬虫执行器（全自动闭环）
# 设计思路：
# - Cloudflare Workers Cron 有 CPU 时间限制，不适合直接跑重度爬虫
# - 本 workflow 作为外部爬虫执行器，由 GitHub Actions schedule 定时触发
# - 也可通过 workflow_dispatch 手动触发，便于调试
# - 闭环链路：process.js 爬取+提取 → upload-to-d1.js 规则清洗 → Worker /api/import（D1 binding 直连写库）
# - 全程无需 wrangler 凭证；唯一 secret：AI_API_TOKEN（调 /api/ai/extract 与 /api/import 的 Bearer token）
name: Scheduled Crawler

on:
  schedule:
    # 每天 UTC 18:07 和 UTC 6:23 运行（对应北京时间 2:07 和 14:23）
    - cron: '7 18 * * *'
    - cron: '23 6 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd crawlers
          npm install

      - name: Run crawler
        run: |
          cd crawlers
          node process.js
        env:
          NODE_ENV: production

      # 自动上传：规则引擎清洗 → POST Worker /api/import（D1 binding 直连写库，INSERT OR IGNORE 去重）
      - name: Upload to D1 via Worker API
        run: |
          cd crawlers
          node upload-to-d1.js
        env:
          AI_API_TOKEN: ${{ secrets.AI_API_TOKEN }}
          INPUT_JSON: ./output/processed-data.json
