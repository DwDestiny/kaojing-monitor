# 注意：本项目前端部署走 Cloudflare Pages 原生 Git 集成（push 到 main 自动构建）。
# 本 workflow 与原生集成是两条独立部署通道，若同时启用会在每次 push 时互相覆盖，
# 导致线上出现「index.html 与静态资源来自不同构建」的混用问题（曾引发 404）。
# 因此这里改为仅手动触发（workflow_dispatch）作为备用通道，不会自动运行。
# 如需使用本通道，请先在 GitHub Secrets 配置 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID。
name: Build and Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://kaojing-api.dangwei121105.workers.dev
        run: |
          cd frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=kaojing-monitor
